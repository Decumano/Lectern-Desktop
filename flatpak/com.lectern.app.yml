id: com.lectern.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: Lectern

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: lectern
    buildsystem: simple
    sources:
      - type: file
        path: com.lectern.app.metainfo.xml
      # TODO: point this at the first release published under the Lectern name
      # and refresh the checksum. The v0.12.6 asset below still carries the old
      # `officesuite` names, so the paths under `deb-extract/` will not match
      # until that release exists.
      - type: file
        url: https://github.com/Decumano/OfficeSuite/releases/download/v0.12.6/officesuite_0.12.6_amd64.deb
        sha256: 9b6cca1b817711d703213a4ef9385a5487589430e23b5613217c810b171b4170
        only-arches: [x86_64]
    # Paths under deb-extract/ follow Tauri's Debian layout for productName
    # "Lectern": the binary keeps the product name, the .desktop file and the
    # icons use the lowercased package name. Verify against the first Lectern
    # .deb before trusting a build.
    build-command:
      - set -e
      - mkdir deb-extract
      - ar -x *-deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/Lectern /app/bin/Lectern
      - sed -i 's/^Icon=.*/Icon=com.lectern.app/' deb-extract/usr/share/applications/lectern.desktop
      - install -Dm644 deb-extract/usr/share/applications/lectern.desktop /app/share/applications/com.lectern.app.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/lectern.png /app/share/icons/hicolor/32x32/apps/com.lectern.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/lectern.png /app/share/icons/hicolor/128x128/apps/com.lectern.app.png
      - install -Dm644 com.lectern.app.metainfo.xml /app/share/metainfo/com.lectern.app.metainfo.xml
