id: com.lectern.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: Lectern

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: lectern
    buildsystem: simple
    sources:
      - type: file
        path: com.lectern.app.metainfo.xml
      - type: file
        url: https://github.com/Decumano/Lectern-Desktop/releases/download/v0.12.10/lectern_0.12.10_amd64.deb
        sha256: 0019dfc4b32d63c1392aa264aed2253c1e0c2fb09216f8e2cc269bbfb8bb49b5
        only-arches: [x86_64]
    build-command:
      - set -e
      - mkdir deb-extract
      - ar -x *-deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/Lectern /app/bin/Lectern
      - sed -i 's/^Icon=.*/Icon=com.lectern.app/' deb-extract/usr/share/applications/lectern.desktop
      - install -Dm644 deb-extract/usr/share/applications/lectern.desktop /app/share/applications/com.lectern.app.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/lectern.png /app/share/icons/hicolor/32x32/apps/com.lectern.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/lectern.png /app/share/icons/hicolor/128x128/apps/com.lectern.app.png
      - install -Dm644 com.lectern.app.metainfo.xml /app/share/metainfo/com.lectern.app.metainfo.xml
