id: com.officesuite.app
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: officesuite

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --filesystem=home

modules:
  - name: officesuite
    buildsystem: simple
    sources:
      - type: file
        path: com.officesuite.app.metainfo.xml
      - type: file
        url: https://github.com/Decumano/OfficeSuite/releases/download/v0.12.6/officesuite_0.12.6_amd64.deb
        sha256: 9b6cca1b817711d703213a4ef9385a5487589430e23b5613217c810b171b4170
        only-arches: [x86_64]
    build-command:
      - set -e
      - mkdir deb-extract
      - ar -x *-deb --output deb-extract
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/officesuite /app/bin/officesuite
      - sed -i 's/^Icon=.*/Icon=com.officesuite.app/' deb-extract/usr/share/applications/officesuite.desktop
      - install -Dm644 deb-extract/usr/share/applications/officesuite.desktop /app/share/applications/com.officesuite.app.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/officesuite.png /app/share/icons/hicolor/32x32/apps/com.officesuite.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/officesuite.png /app/share/icons/hicolor/128x128/apps/com.officesuite.app.png
      - install -Dm644 com.officesuite.app.metainfo.xml /app/share/metainfo/com.officesuite.app.metainfo.xml
